<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap');

:root {
  --bg:      #080b10;
  --surf:    #0d1117;
  --surf2:   #0a0f18;
  --border:  #1a2233;
  --accent:  #00e5ff;
  --red:     #ff3366;
  --green:   #00ff88;
  --muted:   #3d4f66;
  --text:    #c9d8ef;
  --mono:    'JetBrains Mono', monospace;
  --sans:    'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.login-container {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}

.login-box {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px 36px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.logo-area {
  text-align: center;
  margin-bottom: 32px;
}

.logo {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 28px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.logo-dot {
  width: 9px;
  height: 9px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% { opacity: .4; transform: scale(.6); }
}

.subtitle {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.form-input {
  width: 100%;
  font-family: var(--mono);
  font-size: 14px;
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  color: var(--text);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
}

.form-input::placeholder {
  color: var(--muted);
  opacity: 0.5;
}

.error-msg {
  background: rgba(255, 51, 102, 0.15);
  border: 1px solid rgba(255, 51, 102, 0.3);
  border-radius: 6px;
  padding: 12px 14px;
  color: var(--red);
  font-size: 12px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-login {
  width: 100%;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  padding: 14px;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: #000;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.btn-login:hover {
  opacity: 0.85;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
}

.btn-login:active {
  transform: translateY(0);
}

.footer-note {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: var(--muted);
}

.footer-note code {
  background: var(--surf2);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  color: var(--accent);
}

/* Animated background */
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(5deg); }
}

.bg-decoration {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  animation: float 8s ease-in-out infinite;
  pointer-events: none;
}

.bg-decoration.d1 {
  top: -100px;
  right: -100px;
  background: var(--accent);
}

.bg-decoration.d2 {
  bottom: -100px;
  left: -100px;
  background: var(--green);
  animation-delay: -4s;
}
</style>
</head>
<body>

<div class="bg-decoration d1"></div>
<div class="bg-decoration d2"></div>

<div class="login-container">
  <div class="login-box">
    <div class="logo-area">
      <div class="logo">
        <span class="logo-dot"></span>
        GLORY VN 
      </div>
      <div class="subtitle">Admin Panel</div>
    </div>

    {% if error %}
    <div class="error-msg">
      <span>⚠</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="Enter username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="footer-note">
      Session valid for <code>10 minutes</code> per IP
    </div>
  </div>
</div>

</body>
</html>
